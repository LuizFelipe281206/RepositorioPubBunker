server.port=8080
server.address=0.0.0.0
spring.datasource.url=${PUBBUNKER_DB_URL:jdbc:postgresql://localhost:5432/pubbunker}
spring.datasource.username=${PUBBUNKER_DB_USERNAME}
spring.datasource.password=${PUBBUNKER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'
pubbunker.security.migrar-senhas=${PUBBUNKER_MIGRAR_SENHAS:false}
pubbunker.security.front-origins=http://localhost:3000,http://127.0.0.1:3000,http://192.168.100.58:3000
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=PUBBUNKER_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${PUBBUNKER_COOKIE_SECURE:false}