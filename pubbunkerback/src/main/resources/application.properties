server.port=8080
server.address=0.0.0.0
spring.datasource.url=${PUBBUNKER_DB_URL:jdbc:postgresql://localhost:5432/pubbunker}
spring.datasource.username=${PUBBUNKER_DB_USERNAME}
spring.datasource.password=${PUBBUNKER_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

spring.datasource.hikari.connection-init-sql=SET NAMES 'UTF8'